<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <meta http-equiv="refresh" content="30" />
  <title>Phoenix — Back Soon</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      background: #030305;
      color: #f5f0e8;
      font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
      position: relative;
    }

    /* ── Background layers ── */
    .bg-mesh {
      position: fixed; inset: 0; z-index: 0;
      background:
        radial-gradient(ellipse 800px 600px at 50% 40%, rgba(196,30,58,0.08), transparent),
        radial-gradient(ellipse 600px 400px at 30% 70%, rgba(240,200,80,0.04), transparent),
        radial-gradient(ellipse 500px 500px at 70% 30%, rgba(145,70,255,0.04), transparent);
    }

    .scanlines {
      position: fixed; inset: 0; z-index: 1;
      pointer-events: none;
      opacity: 0.025;
      background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(255,255,255,0.03) 2px, rgba(255,255,255,0.03) 4px);
      animation: scanMove 12s linear infinite;
    }
    @keyframes scanMove { 0% { transform: translateY(-100%); } 100% { transform: translateY(100%); } }

    .vignette {
      position: fixed; inset: 0; z-index: 2;
      pointer-events: none;
      background: radial-gradient(ellipse at center, transparent 30%, rgba(3,3,5,0.7) 100%);
    }

    /* ── Floating particles ── */
    .particles { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 3; }
    .particle {
      position: absolute;
      border-radius: 50%;
      opacity: 0;
      animation: floatUp linear infinite;
    }
    .particle:nth-child(1)  { left: 10%; width: 2px; height: 2px; background: #c41e3a; animation-duration: 9s;  animation-delay: 0s; }
    .particle:nth-child(2)  { left: 22%; width: 3px; height: 3px; background: #ff6b35; animation-duration: 11s; animation-delay: 1s; }
    .particle:nth-child(3)  { left: 35%; width: 2px; height: 2px; background: #f0c850; animation-duration: 8s;  animation-delay: 2.5s; }
    .particle:nth-child(4)  { left: 48%; width: 1.5px; height: 1.5px; background: #c41e3a; animation-duration: 13s; animation-delay: 0.5s; }
    .particle:nth-child(5)  { left: 60%; width: 2.5px; height: 2.5px; background: #ff6b35; animation-duration: 10s; animation-delay: 3s; }
    .particle:nth-child(6)  { left: 72%; width: 2px; height: 2px; background: #f0c850; animation-duration: 12s; animation-delay: 1.5s; }
    .particle:nth-child(7)  { left: 85%; width: 1.5px; height: 1.5px; background: #c41e3a; animation-duration: 14s; animation-delay: 4s; }
    .particle:nth-child(8)  { left: 18%; width: 3px; height: 3px; background: rgba(196,30,58,0.6); animation-duration: 15s; animation-delay: 2s; }
    .particle:nth-child(9)  { left: 55%; width: 2px; height: 2px; background: rgba(240,200,80,0.5); animation-duration: 11s; animation-delay: 5s; }
    .particle:nth-child(10) { left: 78%; width: 2.5px; height: 2.5px; background: rgba(196,30,58,0.4); animation-duration: 13s; animation-delay: 0.8s; }
    .particle:nth-child(11) { left: 42%; width: 1px; height: 1px; background: #ff6b35; animation-duration: 16s; animation-delay: 3.5s; }
    .particle:nth-child(12) { left: 90%; width: 2px; height: 2px; background: rgba(145,70,255,0.4); animation-duration: 14s; animation-delay: 1.2s; }

    @keyframes floatUp {
      0%   { bottom: -10px; opacity: 0; transform: translateX(0); }
      8%   { opacity: 0.7; }
      50%  { transform: translateX(20px); }
      92%  { opacity: 0.15; }
      100% { bottom: 110vh; opacity: 0; transform: translateX(-10px); }
    }

    /* ── Central glow ── */
    .glow-outer {
      position: fixed;
      top: 50%; left: 50%;
      width: 800px; height: 800px;
      transform: translate(-50%, -55%);
      border-radius: 50%;
      background: radial-gradient(circle, rgba(196,30,58,0.1) 0%, transparent 55%);
      pointer-events: none;
      filter: blur(80px);
      z-index: 4;
      animation: glowPulse 5s ease-in-out infinite;
    }
    .glow-inner {
      position: fixed;
      top: 50%; left: 50%;
      width: 300px; height: 300px;
      transform: translate(-50%, -60%);
      border-radius: 50%;
      background: radial-gradient(circle, rgba(240,200,80,0.06) 0%, transparent 60%);
      pointer-events: none;
      filter: blur(40px);
      z-index: 4;
      animation: glowPulse 5s ease-in-out infinite 0.5s;
    }
    @keyframes glowPulse {
      0%, 100% { opacity: 0.7; transform: translate(-50%, -55%) scale(1); }
      50% { opacity: 1; transform: translate(-50%, -55%) scale(1.05); }
    }

    /* ── Ring pulse ── */
    .ring {
      position: fixed;
      top: 50%; left: 50%;
      width: 200px; height: 200px;
      transform: translate(-50%, -55%);
      border-radius: 50%;
      border: 1px solid rgba(196,30,58,0.15);
      pointer-events: none;
      z-index: 5;
      animation: ringExpand 4s ease-out infinite;
    }
    .ring:nth-child(2) { animation-delay: 1.3s; }
    .ring:nth-child(3) { animation-delay: 2.6s; }
    @keyframes ringExpand {
      0%   { width: 80px; height: 80px; opacity: 0.5; border-color: rgba(196,30,58,0.3); }
      100% { width: 500px; height: 500px; opacity: 0; border-color: rgba(196,30,58,0); }
    }

    /* ── Content ── */
    .phoenix {
      position: relative;
      z-index: 10;
      text-align: center;
      padding: 0 24px;
      max-width: 580px;
      animation: contentFadeUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) both;
    }

    @keyframes contentFadeUp {
      from { opacity: 0; transform: translateY(30px) scale(0.97); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    .flame-wrap {
      position: relative;
      display: inline-block;
      margin-bottom: 12px;
    }
    .flame {
      display: inline-block;
      animation: flameRise 3s ease-in-out infinite;
      filter: drop-shadow(0 0 20px rgba(196,30,58,0.4)) drop-shadow(0 0 40px rgba(240,200,80,0.2));
    }
    .flame-glow {
      position: absolute;
      inset: -20px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(196,30,58,0.15), transparent 60%);
      animation: glowPulse 3s ease-in-out infinite;
      pointer-events: none;
    }
    @keyframes flameRise {
      0%, 100% { transform: translateY(0) rotate(-1deg) scale(1); }
      25% { transform: translateY(-8px) rotate(1deg) scale(1.02); }
      50% { transform: translateY(-14px) rotate(-0.5deg) scale(1.04); }
      75% { transform: translateY(-6px) rotate(0.5deg) scale(1.01); }
    }

    .title {
      font-size: clamp(3rem, 12vw, 6.5rem);
      line-height: 1;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      font-weight: 800;
      margin: 20px 0 18px;
      background: linear-gradient(135deg, #f0c850 0%, #ff6b35 30%, #c41e3a 65%, #8b1428 100%);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: none;
      filter: drop-shadow(0 0 30px rgba(196,30,58,0.2));
    }

    .rule {
      width: 80px;
      height: 1px;
      margin: 0 auto 28px;
      background: linear-gradient(90deg, transparent, rgba(196,30,58,0.5), rgba(240,200,80,0.3), rgba(196,30,58,0.5), transparent);
      position: relative;
    }
    .rule::after {
      content: '';
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      width: 6px; height: 6px;
      border-radius: 50%;
      background: rgba(196,30,58,0.4);
      box-shadow: 0 0 12px rgba(196,30,58,0.3);
    }

    .sub {
      font-size: 12px;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: #6b5e4a;
      font-weight: 600;
      margin-bottom: 14px;
    }
    .msg {
      font-size: 14px;
      color: #b8a98a;
      line-height: 1.8;
      margin-bottom: 36px;
      opacity: 0.85;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 15px 36px;
      border-radius: 999px;
      background: linear-gradient(135deg, #c41e3a, #8b1428);
      color: #fff;
      text-decoration: none;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      border: 1px solid rgba(196,30,58,0.4);
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      position: relative;
      overflow: hidden;
    }
    .btn::before {
      content: '';
      position: absolute;
      inset: -1px;
      border-radius: 999px;
      padding: 1px;
      background: linear-gradient(135deg, rgba(240,200,80,0.3), transparent, rgba(196,30,58,0.3));
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.3s;
    }
    .btn:hover {
      transform: translateY(-3px);
      box-shadow: 0 12px 40px rgba(196,30,58,0.3), 0 0 60px rgba(196,30,58,0.1);
    }
    .btn:hover::before { opacity: 1; }
    .btn:active { transform: translateY(-1px); }

    .discord-icon { width: 16px; height: 16px; opacity: 0.85; }

    /* ── Status bar ── */
    .status-bar {
      margin-top: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .status-dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: #c41e3a;
      animation: statusPulse 2s ease-in-out infinite;
      box-shadow: 0 0 8px rgba(196,30,58,0.4);
    }
    @keyframes statusPulse {
      0%, 100% { opacity: 0.3; transform: scale(0.8); }
      50% { opacity: 1; transform: scale(1.2); }
    }
    .status-text {
      font-size: 10px;
      color: #3d3528;
      letter-spacing: 0.15em;
      text-transform: uppercase;
    }

    /* ── Progress bar ── */
    .progress-wrap {
      margin-top: 24px;
      width: 200px;
      height: 2px;
      background: rgba(255,255,255,0.04);
      border-radius: 999px;
      overflow: hidden;
      margin-left: auto;
      margin-right: auto;
    }
    .progress-bar {
      height: 100%;
      width: 30%;
      border-radius: 999px;
      background: linear-gradient(90deg, transparent, rgba(196,30,58,0.5), transparent);
      animation: progressSweep 3s ease-in-out infinite;
    }
    @keyframes progressSweep {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(400%); }
    }
  </style>
</head>
<body>
  <div class="bg-mesh"></div>
  <div class="scanlines"></div>
  <div class="vignette"></div>

  <div class="particles" aria-hidden="true">
    <div class="particle"></div><div class="particle"></div><div class="particle"></div>
    <div class="particle"></div><div class="particle"></div><div class="particle"></div>
    <div class="particle"></div><div class="particle"></div><div class="particle"></div>
    <div class="particle"></div><div class="particle"></div><div class="particle"></div>
  </div>

  <div class="glow-outer"></div>
  <div class="glow-inner"></div>
  <div class="ring"></div>
  <div class="ring"></div>
  <div class="ring"></div>

  <div class="phoenix">
    <div class="flame-wrap" aria-hidden="true">
      <div class="flame-glow"></div>
      <div class="flame">
        <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="#ff6b35" stroke-width="1" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 2c1.5 3 4 4.5 4 8a4 4 0 01-8 0c0-1.2.4-2.2 1-3-1 1.5-1.6 3-1.6 4.5 0 3.6 2.9 6.5 6.5 6.5s6.5-2.9 6.5-6.5C20.4 7 16 5 12 2z" />
          <path d="M12 22c-2-1.6-3-3.4-3-5.5a3.5 3.5 0 017 0c0 2.1-1 3.9-3 5.5z" />
        </svg>
      </div>
    </div>

    <h1 class="title">Phoenix</h1>
    <div class="rule"></div>
    <p class="sub">Undergoing Maintenance</p>
    <p class="msg">We&rsquo;re updating the community site and will be right back.<br />Join the Discord for live updates in the meantime.</p>

    <a class="btn" href="https://discord.gg/rapZCCQBv">
      <svg class="discord-icon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
        <path d="M20.317 4.37a19.79 19.79 0 00-4.885-1.515.074.074 0 00-.079.037c-.21.375-.444.864-.608 1.25a18.27 18.27 0 00-5.487 0 12.64 12.64 0 00-.617-1.25.077.077 0 00-.079-.037A19.736 19.736 0 003.677 4.37a.07.07 0 00-.032.027C.533 9.046-.32 13.58.099 18.057a.082.082 0 00.031.057 19.9 19.9 0 005.993 3.03.078.078 0 00.084-.028c.462-.63.874-1.295 1.226-1.994a.076.076 0 00-.041-.106 13.107 13.107 0 01-1.872-.892.077.077 0 01-.008-.128 10.2 10.2 0 00.372-.293.074.074 0 01.077-.01c3.928 1.793 8.18 1.793 12.062 0a.074.074 0 01.078.01c.12.098.246.198.373.292a.077.077 0 01-.006.127 12.3 12.3 0 01-1.873.892.077.077 0 00-.041.107c.36.698.772 1.362 1.225 1.993a.076.076 0 00.084.028 19.839 19.839 0 006.002-3.03.077.077 0 00.032-.054c.5-5.177-.838-9.674-3.549-13.66a.061.061 0 00-.031-.03zM8.02 15.33c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.956-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.956 2.418-2.157 2.418zm7.975 0c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.955-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.946 2.418-2.157 2.418z"/>
      </svg>
      JOIN OUR DISCORD
    </a>

    <div class="status-bar">
      <div class="status-dot"></div>
      <span class="status-text">This page refreshes automatically</span>
    </div>
    <div class="progress-wrap"><div class="progress-bar"></div></div>
  </div>
</body>
</html>
