<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>Phoenix — Back Soon</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      background: #050507;
      color: #f5f0e8;
      font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
      position: relative;
    }
    .glow {
      position: fixed;
      top: 50%;
      left: 50%;
      width: 640px;
      height: 640px;
      transform: translate(-50%, -50%);
      border-radius: 50%;
      background: radial-gradient(circle, rgba(196, 30, 58, 0.10) 0%, transparent 65%);
      pointer-events: none;
      filter: blur(120px);
    }
    .phoenix {
      position: relative;
      z-index: 1;
      text-align: center;
      padding: 0 24px;
      max-width: 560px;
      animation: fade-up 0.7s cubic-bezier(0.16, 1, 0.3, 1) both;
    }
    .flame {
      display: inline-block;
      animation: rise 2.6s ease-in-out infinite;
    }
    .title {
      font-size: clamp(2.6rem, 10vw, 5.5rem);
      line-height: 1.02;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      font-weight: 800;
      margin: 28px 0 22px;
      background: linear-gradient(135deg, #f0c850 0%, #ff6b35 35%, #c41e3a 70%, #8b1428 100%);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .rule {
      width: 72px;
      height: 1px;
      margin: 0 auto 26px;
      background: linear-gradient(90deg, transparent, #c41e3a, transparent);
    }
    .sub {
      font-size: 13px;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: #6b5e4a;
      font-weight: 600;
      margin-bottom: 12px;
    }
    .msg {
      font-size: 14px;
      color: #b8a98a;
      line-height: 1.7;
      margin-bottom: 34px;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 14px 32px;
      border-radius: 999px;
      background: linear-gradient(135deg, #c41e3a, #8b1428);
      color: #fff;
      text-decoration: none;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      border: 1px solid rgba(196, 30, 58, 0.35);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }
    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 30px rgba(196, 30, 58, 0.25);
    }
    .discord-icon {
      width: 16px;
      height: 16px;
      opacity: 0.8;
    }
    @keyframes fade-up {
      from { opacity: 0; transform: translateY(24px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes rise {
      0%, 100% { transform: translateY(0) rotate(-2deg); }
      50% { transform: translateY(-12px) rotate(3deg); }
    }
  </style>
</head>
<body>
  <div class="glow"></div>
  <div class="phoenix">
    <div class="flame" aria-hidden="true">
      <svg width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="#ff6b35" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 2c1.5 3 4 4.5 4 8a4 4 0 01-8 0c0-1.2.4-2.2 1-3-1 1.5-1.6 3-1.6 4.5 0 3.6 2.9 6.5 6.5 6.5s6.5-2.9 6.5-6.5C20.4 7 16 5 12 2z" />
        <path d="M12 22c-2-1.6-3-3.4-3-5.5a3.5 3.5 0 017 0c0 2.1-1 3.9-3 5.5z" />
      </svg>
    </div>
    <h1 class="title">Phoenix</h1>
    <div class="rule"></div>
    <p class="sub">Undergoing Maintenance</p>
    <p class="msg">We&rsquo;re updating the community site and will be right back.<br />Join the Discord for live updates in the meantime.</p>
    <a class="btn" href="https://discord.gg/rapZCCQBv">
      <svg class="discord-icon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
        <path d="M20.317 4.37a19.79 19.79 0 00-4.885-1.515.074.074 0 00-.079.037c-.21.375-.444.864-.608 1.25a18.27 18.27 0 00-5.487 0 12.64 12.64 0 00-.617-1.25.077.077 0 00-.079-.037A19.736 19.736 0 003.677 4.37a.07.07 0 00-.032.027C.533 9.046-.32 13.58.099 18.057a.082.082 0 00.031.057 19.9 19.9 0 005.993 3.03.078.078 0 00.084-.028c.462-.63.874-1.295 1.226-1.994a.076.076 0 00-.041-.106 13.107 13.107 0 01-1.872-.892.077.077 0 01-.008-.128 10.2 10.2 0 00.372-.293.074.074 0 01.077-.01c3.928 1.793 8.18 1.793 12.062 0a.074.074 0 01.078.01c.12.098.246.198.373.292a.077.077 0 01-.006.127 12.3 12.3 0 01-1.873.892.077.077 0 00-.041.107c.36.698.772 1.362 1.225 1.993a.076.076 0 00.084.028 19.839 19.839 0 006.002-3.03.077.077 0 00.032-.054c.5-5.177-.838-9.674-3.549-13.66a.061.061 0 00-.031-.03zM8.02 15.33c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.956-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.956 2.418-2.157 2.418zm7.975 0c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.955-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.946 2.418-2.157 2.418z"/>
      </svg>
      JOIN OUR DISCORD
    </a>
  </div>
</body>
</html>
